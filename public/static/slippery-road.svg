<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Diamond yellow warning sign -->
  <rect x="34" y="34" width="132" height="132" rx="12" fill="#FFCC00" stroke="#1A1A1A" stroke-width="6" transform="rotate(45, 100, 100)" />
  <rect x="38" y="38" width="124" height="124" rx="8" fill="none" stroke="#1A1A1A" stroke-width="1.5" transform="rotate(45, 100, 100)" />

  <!-- Car silhouette tilted to the right -->
  <g transform="translate(100, 78) rotate(15) scale(1.15)">
    <!-- Car body and roof -->
    <path d="M -18 10 Q -18 3, -12 3 L 12 3 Q 18 3, 18 10 L 22 10 Q 24 10, 24 14 L -24 14 Q -24 10, -22 10 Z" fill="#1A1A1A" />
    <!-- Windshield / Window -->
    <path d="M -10 5 L 10 5 L 14 10 L -14 10 Z" fill="#FFCC00" />
    <!-- Divider in windshield -->
    <rect x="-1" y="5" width="2" height="5" fill="#1A1A1A" />
    <!-- Wheels -->
    <rect x="-15" y="14" width="6" height="5" rx="1.5" fill="#1A1A1A" />
    <rect x="9" y="14" width="6" height="5" rx="1.5" fill="#1A1A1A" />
  </g>

  <!-- Wavy sliding tracks (skid marks) -->
  <path d="M 82 104 Q 65 115, 95 125 T 100 148" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />
  <path d="M 112 100 Q 95 112, 125 122 T 120 144" fill="none" stroke="#1A1A1A" stroke-width="4.5" stroke-linecap="round" />
</svg>
