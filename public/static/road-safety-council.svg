<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Circular base -->
  <circle cx="100" cy="100" r="95" fill="white" stroke="#E63946" stroke-width="12" />
  <circle cx="100" cy="100" r="76" fill="none" stroke="#E63946" stroke-width="2" />

  <!-- Road graphic curving from bottom-center to center-right -->
  <path d="M 85 174 Q 100 135, 120 120 T 175 110" fill="none" stroke="#4A4A4A" stroke-width="22" stroke-linecap="round" />
  <!-- Road dashed lane marker -->
  <path d="M 85 174 Q 100 135, 120 120 T 175 110" fill="none" stroke="white" stroke-width="1.5" stroke-dasharray="4,5" />

  <!-- Text inside the circle -->
  <text x="100" y="70" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#2B2D42" text-anchor="middle">ROAD</text>
  <text x="100" y="93" font-family="'Inter', sans-serif" font-size="20" font-weight="900" fill="#2B2D42" text-anchor="middle">SAFETY</text>
  
  <text x="100" y="112" font-family="'Inter', sans-serif" font-size="10.5" font-weight="900" fill="#004d26" letter-spacing="0.5" text-anchor="middle">COUNCIL OF PAKISTAN</text>

  <!-- Icons in the red outer ring (colored white) -->
  <!-- 1. Top Car -->
  <g transform="translate(68, 6) scale(0.65)" fill="white">
    <path d="M 12 30 Q 12 24, 25 24 T 38 30 Z" />
    <rect x="10" y="30" width="30" height="8" rx="2" />
    <circle cx="17" cy="38" r="4" fill="#E63946" />
    <circle cx="33" cy="38" r="4" fill="#E63946" />
  </g>

  <!-- 2. Top-Right Bus -->
  <g transform="translate(120, 7) scale(0.65)" fill="white">
    <rect x="10" y="24" width="35" height="14" rx="3" />
    <line x1="10" y1="31" x2="45" y2="31" stroke="#E63946" stroke-width="1.5" />
    <circle cx="18" cy="38" r="3.5" fill="#E63946" />
    <circle cx="37" cy="38" r="3.5" fill="#E63946" />
  </g>

  <!-- 3. Left Motorcycle -->
  <g transform="translate(8, 75) scale(0.6)" fill="white">
    <circle cx="15" cy="25" r="7" stroke="white" stroke-width="2" fill="none" />
    <circle cx="45" cy="25" r="7" stroke="white" stroke-width="2" fill="none" />
    <path d="M 15 25 L 28 15 L 40 25" stroke="white" stroke-width="2.5" fill="none" />
    <path d="M 28 15 L 28 8 L 35 12" stroke="white" stroke-width="2.5" fill="none" />
    <circle cx="28" cy="4" r="3" />
  </g>

  <!-- 4. Bottom-Left Bicycle -->
  <g transform="translate(30, 142) scale(0.65)" stroke="white" stroke-width="2.5" fill="none">
    <circle cx="15" cy="25" r="7" />
    <circle cx="45" cy="25" r="7" />
    <path d="M 15 25 L 27 15 L 39 25 L 27 25 Z" />
    <path d="M 27 15 L 33 5 L 40 5" />
  </g>

  <!-- 5. Bottom Truck -->
  <g transform="translate(100, 154) scale(0.6)" fill="white">
    <rect x="10" y="22" width="22" height="16" rx="1" />
    <path d="M 32 26 L 44 26 L 44 38 L 32 38 Z" />
    <circle cx="17" cy="38" r="4" fill="#E63946" />
    <circle cx="35" cy="38" r="4" fill="#E63946" />
    <circle cx="41" cy="38" r="4" fill="#E63946" />
  </g>

  <!-- 6. Right Pedestrians (Parent & Child walking) -->
  <g transform="translate(156, 76) scale(0.55)" fill="white">
    <!-- Parent -->
    <circle cx="22" cy="12" r="3.5" />
    <path d="M 17 22 L 20 16 L 24 16 L 27 22 L 25 32 L 23 45 M 21 32 L 19 45 M 15 18 L 22 28 L 28 22" stroke="white" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <!-- Child -->
    <circle cx="36" cy="20" r="2.5" />
    <path d="M 33 27 L 35 23 L 37 23 L 39 27 L 38 34 L 37 42 M 35 34 L 34 42" stroke="white" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
