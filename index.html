  <body>
    <div id="root">
      <!-- Visual Preloader -->
      <div style="font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background-color: #f8fafc;">
        
        <div style="width: 280px; height: 60px; position: relative; border-bottom: 3px solid #e2e8f0; margin-bottom: 30px;">
          <!-- Dashed lines for the road -->
          <div style="position: absolute; bottom: -3px; left: 0; width: 100%; height: 3px; background: repeating-linear-gradient(90deg, #94a3b8 0, #94a3b8 10px, transparent 10px, transparent 20px);"></div>
          
          <!-- Colored Progress Line moving with the car -->
          <div class="road-progress"></div>

          <!-- Finish Line -->
          <div style="position: absolute; right: 0; bottom: -3px; width: 10px; height: 35px; background: repeating-conic-gradient(#000 0% 25%, #fff 0% 50%) 50% / 10px 10px; border: 1px solid #94a3b8; border-bottom: none; z-index: 1;"></div>
          <!-- Flag pole -->
          <div style="position: absolute; right: -2px; bottom: 0; width: 2px; height: 45px; background-color: #64748b; z-index: 1;"></div>

          <!-- Car Wrapper -->
          <div class="car-wrapper" style="position: absolute; bottom: -10px; left: 0; width: 56px; height: 56px; z-index: 2;">
            <div class="smoke"></div>
            <div class="smoke smoke-2"></div>
            
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 100%; height: 100%;">
              <g class="chassis">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
                <path d="M9 17h6"/>
              </g>
              <g class="wheel wheel-back">
                <circle cx="7" cy="17" r="2.2" fill="#f8fafc"/>
                <path d="M7 14.8v4.4 M4.8 17h4.4" stroke="#e2e8f0" stroke-width="0.8" />
              </g>
              <g class="wheel wheel-front">
                <circle cx="17" cy="17" r="2.2" fill="#f8fafc"/>
                <path d="M17 14.8v4.4 M14.8 17h4.4" stroke="#e2e8f0" stroke-width="0.8" />
              </g>
            </svg>
          </div>
        </div>

        <h2 style="color: #0f172a; font-size: 24px; font-weight: 700; margin: 0; letter-spacing: -0.025em; position: relative;">GoDriveify</h2>
        <p style="color: #64748b; font-size: 14px; margin-top: 8px; font-weight: 500;">Starting your engine<span class="dots"></span></p>

        <style>
          .car-wrapper {
            animation: drive 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
          }
          .chassis {
            animation: bounce 0.2s infinite;
          }
          .wheel {
            animation: spin 0.4s linear infinite;
          }
          .wheel-back { transform-origin: 7px 17px; }
          .wheel-front { transform-origin: 17px 17px; }
          
          .smoke {
            position: absolute;
            bottom: 6px;
            left: -10px;
            width: 12px;
            height: 12px;
            background: #cbd5e1;
            border-radius: 50%;
            opacity: 0;
            animation: emitSmoke 0.6s linear infinite;
          }
          .smoke-2 {
            left: -16px;
            bottom: 10px;
            width: 8px;
            height: 8px;
            animation-delay: 0.3s;
          }

          @keyframes drive {
            0% { transform: translateX(0); opacity: 0; }
            5% { opacity: 1; }
            45% { transform: translateX(230px); opacity: 1; }
            50% { transform: translateX(230px); opacity: 1; }
            60% { transform: translateX(260px); opacity: 0; }
            100% { transform: translateX(260px); opacity: 0; }
          }
          @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-0.5px); }
          }
          @keyframes spin {
            100% { transform: rotate(360deg); }
          }
          @keyframes emitSmoke {
            0% { transform: translate(0, 0) scale(0.5); opacity: 0.8; }
            100% { transform: translate(-20px, -10px) scale(1.5); opacity: 0; }
          }

          .road-progress {
            position: absolute;
            left: 0;
            bottom: -3px;
            height: 3px;
            width: 280px;
            background: #dc2626;
            box-shadow: 0 0 8px #dc2626;
            transform-origin: left;
            animation: fillRoad 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
          }
          @keyframes fillRoad {
            0% { transform: scaleX(0); opacity: 0;}
            5% { opacity: 1; }
            45% { transform: scaleX(0.85); opacity: 1; }
            50% { transform: scaleX(0.85); opacity: 1; }
            60% { transform: scaleX(1); opacity: 0; }
            100% { transform: scaleX(1); opacity: 0; }
          }

          .dots {
            display: inline-block;
            width: 20px;
            text-align: left;
            animation: blink 1.5s infinite steps(4, end);
            overflow: hidden;
            vertical-align: bottom;
          }
          .dots::after {
            content: "...";
          }
          @keyframes blink {
            0% { width: 0; }
            100% { width: 14px; }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safeguard: Unregister active service workers and clear stale caches in preview mode to prevent old plain-text cached shells from loading.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          if (registrations.length > 0) {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log('[PWA Cleanup] Unregistered active service worker');
              });
            }
            if ('caches' in window) {
              caches.keys().then(names => {
                Promise.all(names.map(name => caches.delete(name))).then(() => {
                  console.log('[PWA Cleanup] All service worker caches cleared');
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        });
      }
    </script>
  </body>
