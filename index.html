  <body>
    <div id="root">
      <!-- Visual Preloader -->
      <div style="font-family: 'Inter', system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: radial-gradient(circle at center, #0B1120 0%, #030712 100%); overflow: hidden; position: relative;">
        <!-- Backdrop Ambient Glow -->
        <div style="position: absolute; width: 400px; height: 400px; background: radial-gradient(circle, rgba(255, 113, 18, 0.08) 0%, transparent 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); pointer-events: none; filter: blur(40px); animation: ambientPulse 4s ease-in-out infinite;"></div>
        
        <div style="width: 320px; height: 80px; position: relative; margin-bottom: 35px;">
          <!-- Laser Road Grid Line -->
          <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: rgba(255, 113, 18, 0.15); box-shadow: 0 0 4px rgba(255, 113, 18, 0.1);"></div>
          <!-- Dashed scanning lines for the road grid -->
          <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 2px; background: repeating-linear-gradient(90deg, rgba(255, 113, 18, 0.4) 0, rgba(255, 113, 18, 0.4) 15px, transparent 15px, transparent 30px); animation: roadScan 1.2s linear infinite;"></div>
          
          <!-- Colored Progress Line moving with the car -->
          <div class="road-progress"></div>

          <!-- Futuristic Gate Finish Line -->
          <div class="finish-gate" style="position: absolute; right: 0; bottom: 0; width: 6px; height: 35px; background: repeating-linear-gradient(0deg, #f8fafc 0, #f8fafc 4px, #030712 4px, #030712 8px); border: 1.5px solid #FF7112; box-shadow: 0 0 10px rgba(255, 113, 18, 0.6); z-index: 1;"></div>
          <!-- Scanning beam from finishing gate -->
          <div style="position: absolute; right: 1.5px; bottom: 0; width: 1px; height: 35px; background: #fff; box-shadow: 0 0 8px #fff, 0 0 15px #FF7112; z-index: 2;"></div>

          <!-- Car Wrapper containing the neon vehicle & warp particles -->
          <div class="car-wrapper" style="position: absolute; bottom: -4px; left: 0; width: 72px; height: 36px; z-index: 3;">
            <!-- Warp/thrust particles flying backward -->
            <div class="warp-particle particle-1"></div>
            <div class="warp-particle particle-2"></div>
            <div class="warp-particle particle-3"></div>
            
            <!-- Highly futuristic custom supercar SVG contour -->
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 32" fill="none" style="width: 100%; height: 100%; filter: drop-shadow(0 0 5px rgba(255, 113, 18, 0.8));">
              <!-- Aero-hypercar outer chassis frame -->
              <path d="M4 22h4c1 0 1.8-.7 2-1.7l1.5-6c.3-1.2 1.3-2 2.5-2h14c1.2 0 2.2.8 2.5 2l1.5 6c.2 1 .9 1.7 2 1.7h18c1.1 0 2-.9 2-2v-2c0-1.8-1.1-3.4-2.8-4l-8.6-3.2C41.8 4.2 38.3 3 34.7 3H19.6c-2.4 0-4.7 1.1-6.1 3L5.4 17.6C4.5 18.8 4 20.3 4 22z" stroke="#FF7112" stroke-width="2" stroke-linejoin="round"/>
              <!-- Glowing neon composite energy cabin -->
              <path d="M16 11.5h14c1 0 1.8.7 2 1.7l1 3.5H13.6l1.2-4.2c.2-.6.7-1 1.2-1z" fill="rgba(255, 113, 18, 0.25)" stroke="#FF7112" stroke-width="1.2"/>
              <!-- Laser light core strip (speed accent line on chassis side) -->
              <path d="M21 16.5h15" stroke="#FF9E59" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
              <!-- Hyper white LED headlight strip -->
              <path d="M53 18.5h4.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.95" style="filter: drop-shadow(0 0 3px #fff);"/>
              <!-- Neon tail light bar -->
              <path d="M4 17.5h3" stroke="#ff3333" stroke-width="2" stroke-linecap="round" style="filter: drop-shadow(0 0 3px #ff3333);"/>
              <!-- High-velocity futuristic hubless wheels -->
              <g class="cyber-wheel wheel-back">
                <!-- Outer glowing neon ring -->
                <circle cx="16" cy="24" r="6.5" stroke="#FF7112" stroke-width="1.8" fill="none" style="filter: drop-shadow(0 0 3px #FF7112);" />
                <!-- Inner technical segment accents to show spinning motion visibly -->
                <circle cx="16" cy="24" r="3.5" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3.5" fill="none" />
                <!-- Central core power node -->
                <circle cx="16" cy="24" r="1.5" fill="#FF7112" />
              </g>
              <g class="cyber-wheel wheel-front">
                <!-- Outer glowing neon ring -->
                <circle cx="46" cy="24" r="6.5" stroke="#FF7112" stroke-width="1.8" fill="none" style="filter: drop-shadow(0 0 3px #FF7112);" />
                <!-- Inner technical segment accents to show spinning motion visibly -->
                <circle cx="46" cy="24" r="3.5" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="3 3.5" fill="none" />
                <!-- Central core power node -->
                <circle cx="46" cy="24" r="1.5" fill="#FF7112" />
              </g>
            </svg>
          </div>
        </div>

        <h2 class="loader-title" style="color: #ffffff; font-size: 26px; font-weight: 900; margin: 0; letter-spacing: 0.15em; text-transform: uppercase;">
          <span style="color: #FF7112; text-shadow: 0 0 10px rgba(255, 113, 18, 0.5);">Go</span>Driveify
        </h2>
        <p style="color: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; margin-top: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; display: flex; align-items: center; gap: 4px;">
          Starting engine<span class="dots"></span>
        </p>

        <style>
          .car-wrapper {
            animation: drive 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
          }
          .cyber-wheel {
            transform-box: fill-box;
            transform-origin: center;
            animation: spin 0.3s linear infinite;
          }
          
          .warp-particle {
            position: absolute;
            height: 1.5px;
            background: linear-gradient(90deg, transparent, #FF7112, transparent);
            opacity: 0;
            border-radius: 999px;
          }
          .particle-1 {
            left: -15px;
            bottom: 14px;
            width: 25px;
            animation: emitWarp 0.5s linear infinite;
          }
          .particle-2 {
            left: -22px;
            bottom: 8px;
            width: 18px;
            animation: emitWarp 0.4s linear infinite 0.15s;
          }
          .particle-3 {
            left: -18px;
            bottom: 20px;
            width: 20px;
            animation: emitWarp 0.6s linear infinite 0.3s;
          }

          .road-progress {
            position: absolute;
            left: 0;
            bottom: 0px;
            height: 2px;
            width: 320px;
            background: linear-gradient(90deg, #FF7112 0%, #FF9E59 100%);
            box-shadow: 0 0 12px #FF7112, 0 0 4px #FF7112;
            transform-origin: left;
            animation: fillRoad 2.5s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
          }

          .loader-title {
            animation: textGlow 2.5s ease-in-out infinite alternate;
          }

          @keyframes ambientPulse {
            0%, 100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 1.2; transform: translate(-50%, -50%) scale(1.1); }
          }
          
          @keyframes textGlow {
            0% { text-shadow: 0 0 8px rgba(255, 113, 18, 0.2); }
            100% { text-shadow: 0 0 18px rgba(255, 113, 18, 0.6); }
          }

          @keyframes roadScan {
            0% { background-position-x: 0px; }
            100% { background-position-x: -30px; }
          }

          @keyframes drive {
            0% { transform: translateX(0); opacity: 0; }
            4% { opacity: 1; }
            45% { transform: translateX(238px); opacity: 1; }
            52% { transform: translateX(238px); opacity: 1; }
            62% { transform: translateX(265px); opacity: 0; }
            100% { transform: translateX(265px); opacity: 0; }
          }

          @keyframes spin {
            100% { transform: rotate(360deg); }
          }

          @keyframes emitWarp {
            0% { transform: translateX(5px) scaleX(0.4); opacity: 0.8; }
            100% { transform: translateX(-35px) scaleX(1.8); opacity: 0; }
          }

          @keyframes fillRoad {
            0% { transform: scaleX(0); opacity: 0;}
            4% { opacity: 1; }
            45% { transform: scaleX(0.81); opacity: 1; }
            52% { transform: scaleX(0.81); opacity: 1; }
            62% { transform: scaleX(1); opacity: 0; }
            100% { transform: scaleX(1); opacity: 0; }
          }

          .dots {
            display: inline-block;
            width: 20px;
            text-align: left;
            animation: blink 1.5s infinite steps(4, end);
            overflow: hidden;
            vertical-align: bottom;
          }
          .dots::after {
            content: "...";
          }
          @keyframes blink {
            0% { width: 0; }
            100% { width: 15px; }
          }
        </style>
        <!-- Preloader design finishes cleanly without inline scripts -->
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safeguard: Unregister active service workers and clear stale caches in preview mode to prevent old plain-text cached shells from loading.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(registrations => {
          if (registrations.length > 0) {
            for (let registration of registrations) {
              registration.unregister().then(() => {
                console.log('[PWA Cleanup] Unregistered active service worker');
              });
            }
            if ('caches' in window) {
              caches.keys().then(names => {
                Promise.all(names.map(name => caches.delete(name))).then(() => {
                  console.log('[PWA Cleanup] All service worker caches cleared');
                  window.location.reload();
                });
              });
            } else {
              window.location.reload();
            }
          }
        });
      }
    </script>
